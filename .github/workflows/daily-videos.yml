name: Daily videos update
on:
  schedule:
    - cron: '0 6 * * *'     # daily, 06:00 UTC
  workflow_dispatch: {}      # also a manual "Run workflow" button
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Scrape PornHub
        id: scrape
        run: node scrape_ph.mjs
      - run: node build_site.mjs
      - run: node generate_video_pages.mjs
      - name: Commit changes
        if: always() && steps.scrape.outcome == 'success'
        run: |
          git config user.name  "videos-bot"
          git config user.email "videos-bot@users.noreply.github.com"
          git add videos.json tags_overrides.json index.html videos/ sitemap.xml robots.txt
          git diff --cached --quiet || (git commit -m "Daily videos update" && git push)
