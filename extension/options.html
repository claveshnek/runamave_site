<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LarunaMave Watcher — Settings</title>
<style>
  body{background:#0a0a0a;color:#e8e0d0;font-family:system-ui,sans-serif;max-width:480px;margin:30px auto;padding:0 16px;}
  h1{color:#c9a84c;font-size:18px;}
  label{display:block;margin-top:14px;font-size:13px;color:#a89878;}
  input{width:100%;padding:8px;margin-top:4px;background:#1a1a1a;border:1px solid #333;color:#e8e0d0;border-radius:4px;box-sizing:border-box;}
  button{margin-top:20px;background:#c9a84c;color:#0a0a0a;border:none;padding:10px 18px;border-radius:4px;font-weight:700;cursor:pointer;}
  #status{margin-top:14px;font-size:13px;}
  .ok{color:#6fcf6f;} .err{color:#e06666;}
  .hint{font-size:11px;color:#8a8070;margin-top:4px;}
</style>
</head>
<body>
<h1>LarunaMave Video Watcher — настройки</h1>

<label>GitHub owner (аккаунт)
  <input id="owner" placeholder="claveshnek">
</label>
<label>Репозиторий
  <input id="repo" placeholder="runamave_site">
</label>
<label>Ветка
  <input id="branch" placeholder="main" value="main">
</label>
<label>Personal Access Token (fine-grained, Contents: Read & Write, только этот репозиторий)
  <input id="pat" type="password" placeholder="github_pat_...">
  <div class="hint">Создаётся на github.com → Settings → Developer settings → Fine-grained tokens. Хранится только в этом браузере, мне не передаётся.</div>
</label>
<label>Интервал проверки (часы)
  <input id="interval" type="number" min="1" value="24">
</label>

<button id="save">Сохранить</button>
<button id="test" style="background:#333;color:#e8e0d0;margin-left:8px;">Проверить подключение</button>
<div id="status"></div>

<script type="module" src="options.js"></script>
</body>
</html>
