<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LarunaMave Watcher</title>
<style>
  body{background:#0a0a0a;color:#e8e0d0;font-family:system-ui,sans-serif;width:320px;padding:14px;margin:0;}
  h1{color:#c9a84c;font-size:14px;margin:0 0 10px;}
  #status{font-size:13px;margin-bottom:10px;}
  .ok{color:#6fcf6f;} .err{color:#e06666;} .muted{color:#8a8070;}
  button{background:#c9a84c;color:#0a0a0a;border:none;padding:8px 14px;border-radius:4px;font-weight:700;cursor:pointer;width:100%;}
  button:disabled{opacity:.5;cursor:default;}
  a{color:#c9a84c;font-size:12px;}
  #logs{margin-top:12px;max-height:160px;overflow-y:auto;font-size:10px;color:#8a8070;font-family:monospace;white-space:pre-wrap;border-top:1px solid #2a2a2a;padding-top:8px;}
</style>
</head>
<body>
<h1>LarunaMave Video Watcher</h1>
<div id="status">—</div>
<button id="checkNow">Проверить сейчас</button>
<p><a href="options.html" target="_blank">Настройки</a></p>
<div id="logs"></div>
<script src="popup.js"></script>
</body>
</html>
